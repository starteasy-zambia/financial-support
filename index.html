<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Financial Support & Management | StartEasy Zambia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --blue:#1B6CA8;
}
html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: var(--light); color: var(--forest); }
.serif { font-family: 'Playfair Display', Georgia, serif; }
.fadein { animation: fi .5s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

/* Header */
.site-header { position: sticky; top: 0; z-index: 100; background: #0A1F12; padding: 16px 24px; border-bottom: 1px solid rgba(245,166,35,.1); width: 100%; }
.header-content { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.logo-group { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
.logo-mark { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; font-family: 'Playfair Display', serif; }
.logo-text-sub { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; }
.logo-text-main { font-size: 16px; font-weight: 700; color: #fff; }

/* Buttons */
.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; padding: 14px 28px; font-size: 15px; text-decoration: none; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(232,115,15,0.3); }
.btn-dark { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: #0A1F12; color: #fff; padding: 14px 28px; font-size: 15px; text-decoration: none; }
.btn-dark:hover { opacity: 0.9; transform: translateY(-2px); }

/* Sections */
.section-padding { padding: 80px 24px; }
.container { max-width: 1100px; margin: 0 auto; width: 100%; }

/* Cards */
.service-card { background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 32px; transition: all 0.3s; height: 100%; display: flex; flex-direction: column; }
.service-card:hover { box-shadow: 0 20px 40px rgba(10,31,18,0.06); border-color: #E8730F; transform: translateY(-4px); }
.service-icon { width: 56px; height: 56px; border-radius: 12px; background: #FFF9E6; color: #E8730F; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 20px; }

/* Pricing Cards */
.pricing-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; position: relative; }
.pricing-card.popular { border: 2px solid #E8730F; box-shadow: 0 20px 40px rgba(232,115,15,0.1); }
.pricing-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: #E8730F; color: #fff; padding: 4px 16px; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }

/* Lists */
.check-list { list-style: none; padding: 0; margin: 0; }
.check-list li { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; font-size: 14px; color: rgba(10,31,18,0.8); line-height: 1.5; }
.check-list li i { color: #1E7B3C; margin-top: 3px; font-size: 14px; }

/* Timeline */
.step-number { width: 48px; height: 48px; border-radius: 50%; background: #0A1F12; color: #F5A623; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; margin-bottom: 16px; flex-shrink: 0; }

/* Warning Box */
.warning-box { background: #FFF9E6; border-left: 4px solid #E8730F; padding: 24px; border-radius: 0 12px 12px 0; }
</style>
</head>
<body>
<div id="root"></div>

</html>
