/* Header & Nav */

.menu-toggle { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 4px; transition: transform 0.2s; }

/* Buttons */
.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; padding: 14px 28px; font-size: 14.5px; text-decoration: none; box-shadow: 0 10px 26px rgba(232,115,15,.32); }

.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: transparent; color: #fff; padding: 14px 28px; font-size: 14.5px; text-decoration: none; }

.container { max-width: 1240px; margin: 0 auto; width: 100%; }

/* Interactive Elements */

.gtile:hover { border-color: #E8730F; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,.07); }

.gtile.sel .ico { background: #E8730F; color: #fff; }

.gtile p { font-size: 13px; color: rgba(10,31,18,.6); line-height: 1.5; margin: 0; }

.check-list { list-style: none; padding: 0; margin: 0; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 20px 10px; background: rgba(10,31,18,0.92); backdrop-filter: blur(4px); overflow-y: auto; }
.modal-content { background: #F5FAF6; border-radius: 12px; width: 100%; max-width: 56rem; box-shadow: 0 30px 80px rgba(0,0,0,.5); margin: auto; }
.modal-header { background: #0A1F12; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(245,166,35,.15); border-radius: 12px 12px 0 0; }

.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11.5px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:16.5px;color:#0A1F12;font-weight:700;margin:28px 0 12px; border-bottom: 1px solid #eee; padding-bottom: 6px;}

.el .feebox .total .tl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#8A6828}
.el .feebox .total .tv{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#E8730F}

.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size:14px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 8px; transition: all 0.2s;}

/* Payment / Success Boxes */
.success-box { background: #fff; padding: 32px 24px; border-radius: 12px; border: 1px solid #eee; text-align: center; }
.method-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.method-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-weight: 800; color: #0A1F12; font-size: 15px; }
.method-header i { font-size: 20px; color: #E8730F; }
.method-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
.method-row .l { color: #666; font-weight: 600; }
.method-row .v { font-family: Consolas, monospace; font-weight: 700; color: #0A1F12; }

/* ─── ADMIN ─── */
.admin-layout { display: flex; flex-direction: column; min-height: 100vh; background: #F8FAFC; }
.admin-top-bar { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30; }
.admin-hamburger { background: none; border: none; font-size: 20px; color: #0A1F12; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 700; font-family: inherit; }
.admin-drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: #0A1F12; color: #fff; z-index: 50; transform: translateX(-100%); transition: transform 0.3s ease; display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.1); }

.admin-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.admin-nav-section { padding: 24px 24px 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); border-top: 1px solid rgba(255,255,255,0.05); }
.admin-nav-section:first-child { border-top: none; }
.admin-nav-item { padding: 12px 24px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }

.admin-content { padding: 32px; flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 800; color: #0A1F12; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-input { width: 100%; padding: 11px 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: #0A1F12; transition: all .15s; }
.form-input:focus { outline: none; border-color: #E8730F; box-shadow: 0 0 0 3px rgba(232,115,15,0.1); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn-sm { padding: 8px 14px; font-size: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-sm:hover { opacity: 0.85; }
.btn-add { background: #1E7B3C; color: #fff; }
.btn-edit { background: #F5A623; color: #fff; }
.btn-del { background: #FFE8E5; color: #B8564F; }
.modal-form-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(10,31,18,0.9); backdrop-filter: blur(4px); overflow-y: auto; }
.modal-form { background: #fff; border-radius: 12px; width: 100%; max-width: 520px; padding: 28px; max-height: 92vh; overflow-y: auto; margin: auto; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.modal-form h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; color: #0A1F12; margin: 0; }
.kpi-trend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; display: inline-block; }
.kpi-trend.up { background: #D1FAE5; color: #065F46; }
.kpi-trend.down { background: #FFE8E5; color: #B8564F; }
.balance-badge { font-family: 'Consolas', monospace; font-weight: 700; color: #0A1F12; }
.balance-badge.neg { color: #B8564F; }
.cat-bar { height: 8px; border-radius: 4px; background: #F1F5F9; overflow: hidden; margin-top: 4px; }
.cat-bar-fill { height: 100%; background: linear-gradient(90deg,#E8730F,#F5A623); }

@media (max-width: 768px) {
  .admin-content { padding: 16px; }
  .admin-top-bar { padding: 12px 16px; }
  .el { padding: 24px 20px; } 
  .el .eh { flex-direction: column; gap: 12px; } 
  .el .eh .dt, .el .eh .mt { text-align: left; } 
  .el .sign { grid-template-columns: 1fr; gap: 24px; }
  .modal-body { padding: 16px; }
  .report-container { padding: 20px; }
  .form-row { grid-template-columns: 1fr; }
}
</style>

                <option value="Business Control">Business Control — K2,000</option>
                <option value="Growth & Financial Planning">Growth & Financial Planning — K4,000</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Status</label>
              <select className="form-input" value={data.status || 'Active'} onChange={e => set('status', e.target.value)}>
                <option value="Active">Active</option>
                <option value="Paused">Paused</option>
                <option value="Ended">Ended</option>
              </select>
            </div>
          </div>
        </>
      );
    }
    if (modal.type === 'payment') {
      return (
        <>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Client Name *</label>
              <input type="text" className="form-input" value={data.clientName || ''} onChange={e => set('clientName', e.target.value)} required />
            </div>
            <div className="form-group">
              <label className="form-label">Client Email *</label>
              <input type="email" className="form-input" value={data.clientEmail || ''} onChange={e => set('clientEmail', e.target.value)} required />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Service Package *</label>
            <select className="form-input" value={data.serviceTitle || ''} onChange={e => set('serviceTitle', e.target.value)} required>
              <option value="">— Select —</option>
              {PACKAGES.map(p => <option key={p.id} value={p.title}>{p.title} — {p.price}</option>)}
            </select>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Amount (K) *</label>
              <input type="text" className="form-input" value={data.amount || ''} onChange={e => set('amount', e.target.value)} placeholder="e.g. K2,000" required />
            </div>
            <div className="form-group">
              <label className="form-label">Status</label>
              <select className="form-input" value={data.status || 'under_review'} onChange={e => set('status', e.target.value)}>
                <option value="under_review">Under Review</option>
                <option value="approved">Approved</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Phone</label>
            <input type="text" className="form-input" value={data.phone || ''} onChange={e => set('phone', e.target.value)} />
          </div>
        </>
      );
    }
    return null;
  };

  const titleMap = { ledger:'Ledger Entry', invoice:'Invoice', client:'Client', payment:'Payment' };

  return (
    <div className="modal-form-overlay" onClick={onClose}>
      <div className="modal-form" onClick={e => e.stopPropagation()}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
          <h3>{modal.mode === 'add' ? 'Add' : 'Edit'} {titleMap[modal.type]}</h3>
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color:'#666', fontSize:18 }}><i className="fas fa-times"></i></button>
        </div>
        {error && <div style={{ background:'#FFE8E5', color:'#B8564F', padding:12, borderRadius:8, fontSize:13, marginBottom:16, fontWeight:600 }}>{error}</div>}
        <form onSubmit={e => { e.preventDefault(); onSave(data); }}>
          {renderFields()}
          <div style={{ display:'flex', gap:12, marginTop:24 }}>
            <button type="submit" disabled={saving} className="btn-primary" style={{ flex:1, justifyContent:'center' }}>
              {saving ? <><i className="fas fa-circle-notch fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> {modal.mode === 'add' ? 'Create' : 'Update'}</>}
            </button>
            <button type="button" onClick={onClose} style={{ padding:'14px 24px', background:'#fff', border:'1px solid #ccc', borderRadius:9, fontWeight:600, cursor:'pointer' }}>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   ADMIN PORTAL
   ═══════════════════════════════════════════════════════════════════ */
function AdminPortal({ onExit }) {
  const [user, setUser] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [authError, setAuthError] = useState('');
  const [authLoading, setAuthLoading] = useState(true);

  const [payments, setPayments] = useState([]);
  const [ledger, setLedger] = useState([]);
  const [clients, setClients] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [loadingData, setLoadingData] = useState(true);

  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [activeTab, setActiveTab] = useState('overview');
  const [statementTab, setStatementTab] = useState('income');
  const [period, setPeriod] = useState('all');
  const [modal, setModal] = useState(null);
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState('');

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        setUser(u);
        try {
          const snap = await db.collection('se_admins').doc(u.uid).get();
          setIsAdmin(snap.exists);
          if (!snap.exists) setAuthError('Access denied. You are not an authorized admin.');
        } catch (e) { setAuthError('Error verifying admin status: ' + e.message); }
      } else {
        setUser(null); setIsAdmin(false);
      }
      setAuthLoading(false);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!isAdmin) return;
    const unsubPayments = db.collection('se_payments').orderBy('submittedAt','desc').limit(100).onSnapshot(snap => {
      const raw = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      const filtered = raw.filter(p => {
        const e = (p.clientEmail || '').toLowerCase();
        const n = (p.clientName || '').toLowerCase();
        const s = (p.serviceTitle || '').toLowerCase();
        const badE = ['naisainga@gmail.com','lewismwaba@gmail.com','moneyard2@gmail.com'];
        const badN = ['lewis mwaba','mwaba lewis','katongo mercy'];
        return !badE.includes(e) && !badN.includes(n) && !s.includes('buyer access subscription');
      });
      setPayments(filtered);
    }, err => console.error(err));

    const unsubLedger = db.collection('se_ledger').orderBy('date','desc').onSnapshot(snap => {
      setLedger(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    }, err => console.error(err));

    const unsubClients = db.collection('se_clients').onSnapshot(snap => {
      setClients(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    }, err => console.error(err));

    const unsubInvoices = db.collection('se_invoices').onSnapshot(snap => {
      setInvoices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
    }, err => console.error(err));

    setLoadingData(false);
    return () => { unsubPayments(); unsubLedger(); unsubClients(); unsubInvoices(); };
  }, [isAdmin]);

  const handleLogin = async (e) => {
    e.preventDefault(); setAuthError(''); setAuthLoading(true);
    try { await auth.signInWithEmailAndPassword(email, password); }
    catch (err) { setAuthError(err.message); setAuthLoading(false); }
  };
  const handleLogout = () => auth.signOut();

  /* ═══ PERIOD FILTER ═══ */
  const filterByPeriod = (items, dateField = 'date') => {
    if (period === 'all') return items;
    const now = new Date();
    return items.filter(item => {
      const d = toDate(item[dateField]);
      if (!d) return false;
      if (period === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      if (period === 'last_month') {
        const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        return d.getMonth() === lm.getMonth() && d.getFullYear() === lm.getFullYear();
      }
      if (period === 'quarter') return Math.floor(d.getMonth()/3) === Math.floor(now.getMonth()/3) && d.getFullYear() === now.getFullYear();
      if (period === 'year') return d.getFullYear() === now.getFullYear();
      return true;
    });
  };

  const filteredLedger = useMemo(() => filterByPeriod(ledger, 'date'), [ledger, period]);
  const filteredInvoices = useMemo(() => filterByPeriod(invoices, 'issueDate'), [invoices, period]);
  const filteredPayments = useMemo(() => filterByPeriod(payments, 'submittedAt'), [payments, period]);
  const periodLabel = PERIOD_LABELS[period];

  /* ═══ AUTO CALCULATIONS ═══ */
  const calc = useMemo(() => {
    const income = filteredLedger.filter(l => l.type === 'Income');
    const expense = filteredLedger.filter(l => l.type === 'Expense');
    const totalIncome = income.reduce((s, l) => s + num(l.amount), 0);
    const totalExpense = expense.reduce((s, l) => s + num(l.amount), 0);
    const netProfit = totalIncome - totalExpense;
    const profitMargin = totalIncome > 0 ? (netProfit / totalIncome) * 100 : 0;
    const expenseRatio = totalIncome > 0 ? (totalExpense / totalIncome) * 100 : 0;

    const incomeByCategory = {};
    income.forEach(l => { const c = l.category || 'Other Income'; incomeByCategory[c] = (incomeByCategory[c] || 0) + num(l.amount); });
    const expenseByCategory = {};
    expense.forEach(l => { const c = l.category || 'Other'; expenseByCategory[c] = (expenseByCategory[c] || 0) + num(l.amount); });

    const cashflow = { operating: { in: 0, out: 0 }, investing: { in: 0, out: 0 }, financing: { in: 0, out: 0 } };
    filteredLedger.forEach(l => {
      const cls = CASHFLOW_CLASS[l.category] || 'operating';
      const v = num(l.amount);
      if (l.type === 'Income') cashflow[cls].in += v;
      else cashflow[cls].out += v;
    });
    const cfOperating = cashflow.operating.in - cashflow.operating.out;
    const cfInvesting = cashflow.investing.in - cashflow.investing.out;
    const cfFinancing = cashflow.financing.in - cashflow.financing.out;
    const netCashflow = cfOperating + cfInvesting + cfFinancing;

    const approvedPmts = filteredPayments.filter(p => p.status === 'approved');
    const commencementCollected = approvedPmts.reduce((s, p) => s + num(p.amount) / 2, 0);
    const totalRevenue = totalIncome + commencementCollected;

    const invMetrics = { total:0, paid:0, pending:0, overdue:0, count:0 };
    filteredInvoices.forEach(inv => {
      const amt = num(inv.amount);
      invMetrics.total += amt; invMetrics.count += 1;
      const st = getInvoiceStatus(inv);
      if (st === 'Paid') invMetrics.paid += amt;
      else if (st === 'Overdue') invMetrics.overdue += amt;
      else invMetrics.pending += amt;
    });

    const pkgPrice = { 'Financial Starter': 1000, 'Business Control': 2000, 'Growth & Financial Planning': 4000 };
    const activeClients = clients.filter(c => (c.status || 'Active') === 'Active');
    const mrr = activeClients.reduce((s, c) => s + (pkgPrice[c.package] || 0), 0);

    return {
      totalIncome, totalExpense, netProfit, profitMargin, expenseRatio,
      incomeByCategory, expenseByCategory,
      cashflow, cfOperating, cfInvesting, cfFinancing, netCashflow,
      commencementCollected, totalRevenue,
      invMetrics, mrr, activeClients: activeClients.length, totalClients: clients.length
    };
  }, [filteredLedger, filteredInvoices, filteredPayments, clients]);

  const pendingPayments = payments.filter(p => p.status === 'under_review' || !p.status);

  const getInvoiceStatus = (inv) => {
    if (inv.status === 'Paid') return 'Paid';
    const due = toDate(inv.dueDate);
    if (!due) return 'Pending';
    return due < new Date() ? 'Overdue' : 'Pending';
  };
  const nextInvoiceNo = (list) => {
    const year = new Date().getFullYear();
    const maxNum = list.filter(i => (i.invoiceNo || '').startsWith(`INV-${year}-`))
      .reduce((m, i) => Math.max(m, parseInt((i.invoiceNo || '').split('-')[2]) || 0), 0);
    return `INV-${year}-${String(maxNum + 1).padStart(4, '0')}`;
  };

  const openAdd = (type) => {
    const today = todayStr();
    let data = {};
    if (type === 'ledger') data = { date: today, type: 'Income', desc: '', category: 'Service Fees', amount: '', reference: '' };
    if (type === 'invoice') data = { invoiceNo: nextInvoiceNo(invoices), client: '', description: '', issueDate: today, dueDate: addDays(today, 30), amount: '', status: 'Pending' };
    if (type === 'client') data = { name: '', email: '', phone: '', package: 'Business Control', status: 'Active' };
    if (type === 'payment') data = { clientName: '', clientEmail: '', phone: '', serviceTitle: '', amount: '', status: 'under_review' };
    setModal({ type, mode: 'add', data });
    setFormError('');
  };
  const openEdit = (type, data) => {
    setModal({ type, mode: 'edit', data: { ...data } });
    setFormError('');
  };
  const closeModal = () => { setModal(null); setFormError(''); };

  const saveEntry = async (data) => {
    setFormError(''); setSaving(true);
    try {
      if (modal.type === 'ledger') {
        if (!data.desc?.trim()) throw new Error('Description is required');
        if (!data.amount || num(data.amount) <= 0) throw new Error('Amount must be greater than zero');
        const payload = { ...data, amount: num(data.amount) };
        if (modal.mode === 'add') {
          await db.collection('se_ledger').add({ ...payload, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection('se_ledger').doc(data.id).update(payload);
        }
      }
      if (modal.type === 'invoice') {
        if (!data.client?.trim()) throw new Error('Client name is required');
        if (!data.amount || num(data.amount) <= 0) throw new Error('Amount must be greater than zero');
        if (!data.issueDate || !data.dueDate) throw new Error('Issue and due date are required');
        const payload = { ...data, amount: num(data.amount) };
        if (modal.mode === 'add') {
          await db.collection('se_invoices').add({ ...payload, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection('se_invoices').doc(data.id).update(payload);
        }
      }
      if (modal.type === 'client') {
        if (!data.name?.trim()) throw new Error('Name is required');
        if (!data.email?.trim()) throw new Error('Email is required');
        if (modal.mode === 'add') {
          await db.collection('se_clients').add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection('se_clients').doc(data.id).update(data);
        }
      }
      if (modal.type === 'payment') {
        if (!data.clientName?.trim()) throw new Error('Client name is required');
        if (!data.clientEmail?.trim()) throw new Error('Client email is required');
        if (!data.serviceTitle) throw new Error('Service package is required');
        if (!data.amount) throw new Error('Amount is required');
        if (modal.mode === 'add') {
          await db.collection('se_payments').add({ ...data, submittedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await db.collection('se_payments').doc(data.id).update(data);
        }
      }
      closeModal();
    } catch (err) {
      setFormError(err.message);
    } finally {
      setSaving(false);
    }
  };

  const handleDelete = async (collection, id) => {
    if (!window.confirm('Delete this record permanently? This cannot be undone.')) return;
    try { await db.collection(collection).doc(id).delete(); }
    catch (err) { alert('Failed to delete: ' + err.message); }
  };

  const handleVerifyPayment = async (payment) => {
    if (!window.confirm('Verify this payment and add client to active portfolio?')) return;
    try {
      await db.collection('se_payments').doc(payment.id).update({
        status: 'approved',
        verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      const exists = clients.find(c => (c.email || '').toLowerCase() === (payment.clientEmail || '').toLowerCase());
      if (!exists) {
        await db.collection('se_clients').add({
          name: payment.clientName || 'Unknown',
          email: payment.clientEmail || '',
          phone: payment.phone || '',
          package: payment.serviceTitle || '',
          status: 'Active',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    } catch (err) { alert('Failed to verify: ' + err.message); }
  };

  const handleMarkInvoicePaid = async (inv) => {
    try { await db.collection('se_invoices').doc(inv.id).update({ status: 'Paid' }); }
    catch (err) { alert('Failed: ' + err.message); }
  };

  if (authLoading) {
    return <div className="auth-gate"><i className="fas fa-circle-notch fa-spin" style={{ color:'#F5A623', fontSize:32 }}></i></div>;
  }
  if (!user || !isAdmin) {
    return (
      <div className="auth-gate fadein">
        <div className="auth-box">
          <div style={{ textAlign:'center', marginBottom:24 }}>
            <div className="logo-mark" style={{ margin:'0 auto 16px', width:48, height:48, fontSize:22 }}>S</div>
            <h2 className="serif" style={{ fontSize:24, color:'#0A1F12', margin:0 }}>Finance Admin Portal</h2>
            <p style={{ fontSize:14, color:'rgba(10,31,18,0.6)', marginTop:8 }}>Authorized personnel only</p>
          </div>
          {authError && <div style={{ background:'#FFE8E5', color:'#B8564F', padding:12, borderRadius:8, fontSize:13, marginBottom:16, fontWeight:600 }}><i className="fas fa-exclamation-circle"></i> {authError}</div>}
          <form onSubmit={handleLogin}>
            <label style={{ display:'block', fontSize:12, fontWeight:700, color:'#0A1F12', marginBottom:6 }}>Admin Email</label>
            <input type="email" className="auth-input" value={email} onChange={e => setEmail(e.target.value)} required placeholder="admin@starteasyzambia.com" />
            <label style={{ display:'block', fontSize:12, fontWeight:700, color:'#0A1F12', marginBottom:6 }}>Password</label>
            <input type="password" className="auth-input" value={password} onChange={e => setPassword(e.target.value)} required placeholder="••••••••••" />
            <button type="submit" className="btn-primary" style={{ width:'100%', padding:'14px', marginTop:8 }}><i className="fas fa-lock-open"></i> Secure Login</button>
          </form>
          <button onClick={onExit} style={{ width:'100%', background:'none', border:'none', color:'#666', fontSize:13, marginTop:16, cursor:'pointer', textDecoration:'underline' }}>Return to Public Page</button>
        </div>
      </div>
    );
  }

  return (
    <div className="admin-layout fadein">
      <div className="admin-top-bar">
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <button className="admin-hamburger" onClick={() => setIsDrawerOpen(true)}>
            <i className="fas fa-bars"></i>
            <span className="hidden sm:inline">StartEasy Finance</span>
          </button>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <span className="hidden sm:inline" style={{ fontSize:13, fontWeight:600, color:'rgba(10,31,18,0.6)' }}>{user.email}</span>
          <button onClick={handleLogout} style={{ background:'rgba(184,86,79,0.1)', border:'1px solid #B8564F', color:'#B8564F', padding:'8px 16px', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
            <i className="fas fa-sign-out-alt"></i> <span className="hidden sm:inline">Sign Out</span>
          </button>
        </div>
      </div>

      <div className={`admin-drawer-overlay ${isDrawerOpen ? 'open' : ''}`} onClick={() => setIsDrawerOpen(false)}></div>

      <aside className={`admin-drawer ${isDrawerOpen ? 'open' : ''}`}>
        <div style={{ padding:24, borderBottom:'1px solid rgba(255,255,255,0.1)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <div className="logo-mark" style={{ width:32, height:32, fontSize:16 }}>S</div>
            <div>
              <div style={{ fontSize:8, letterSpacing:'0.15em', textTransform:'uppercase', color:'rgba(255,255,255,0.5)', fontWeight:700 }}>Accounting & Finance</div>
              <div style={{ fontSize:14, fontWeight:700, color:'#fff' }}>StartEasy Zambia</div>
            </div>
          </div>
          <button onClick={() => setIsDrawerOpen(false)} style={{ background:'none', border:'none', color:'#fff', cursor:'pointer', fontSize:18 }}><i className="fas fa-times"></i></button>
        </div>

        <nav style={{ flex:1, overflowY:'auto' }}>
          <div className="admin-nav-section">Overview</div>
          <div className={`admin-nav-item ${activeTab==='overview'?'active':''}`} onClick={() => { setActiveTab('overview'); setIsDrawerOpen(false); }}><i className="fas fa-chart-pie"></i> Dashboard</div>

          <div className="admin-nav-section" style={{ color:'#F5A623' }}>Client Operations</div>
          <div className={`admin-nav-item ${activeTab==='onboarding'?'active':''}`} onClick={() => { setActiveTab('onboarding'); setIsDrawerOpen(false); }}>
            <i className="fas fa-money-check-alt"></i> Onboarding Queue {pendingPayments.length > 0 && <span style={{ background:'#B8564F', color:'#fff', borderRadius:99, padding:'2px 8px', fontSize:10, marginLeft:'auto' }}>{pendingPayments.length}</span>}
          </div>
          <div className={`admin-nav-item ${activeTab==='portfolio'?'active':''}`} onClick={() => { setActiveTab('portfolio'); setIsDrawerOpen(false); }}><i className="fas fa-users"></i> Client Portfolio</div>

          <div className="admin-nav-section" style={{ color:'#4CB050' }}>Company Finance</div>
          <div className={`admin-nav-item ${activeTab==='ledger'?'active':''}`} onClick={() => { setActiveTab('ledger'); setIsDrawerOpen(false); }}><i className="fas fa-book"></i> Company Ledger</div>
          <div className={`admin-nav-item ${activeTab==='invoices'?'active':''}`} onClick={() => { setActiveTab('invoices'); setIsDrawerOpen(false); }}><i className="fas fa-file-invoice"></i> Invoicing</div>
          <div className={`admin-nav-item ${activeTab==='statements'?'active':''}`} onClick={() => { setActiveTab('statements'); setIsDrawerOpen(false); }}><i className="fas fa-file-signature"></i> Financial Statements</div>
        </nav>

        <div style={{ padding:24, borderTop:'1px solid rgba(255,255,255,0.1)' }}>
          <button onClick={handleLogout} style={{ width:'100%', background:'rgba(184,86,79,0.2)', border:'1px solid #B8564F', color:'#FFB4A8', padding:'10px', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
            <i className="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      <main className="admin-content">
        {activeTab !== 'statements' && (
          <div className="filter-tabs">
            <span style={{ fontSize:11, fontWeight:800, color:'#64748B', textTransform:'uppercase', letterSpacing:'0.05em', marginRight:8 }}>Period:</span>
            {Object.entries(PERIOD_LABELS).map(([k, label]) => (
              <button key={k} className={`filter-tab ${period===k?'active':''}`} onClick={() => setPeriod(k)}>{label}</button>
            ))}
          </div>
        )}

        {activeTab === 'overview' && (
          <div className="fadein">
            <h1 className="serif" style={{ fontSize:28, fontWeight:800, color:'#0A1F12', marginBottom:8 }}>Finance Dashboard</h1>
            <p style={{ fontSize:13, color:'#64748B', marginBottom:24 }}>Snapshot · {periodLabel}</p>

            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:20, marginBottom:32 }}>
              <div className="admin-card">
                <div style={{ fontSize:11, fontWeight:800, color:'rgba(10,31,18,0.5)', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:8 }}>Gross Revenue</div>
                <div className="serif" style={{ fontSize:30, fontWeight:800, color:'#1E7B3C' }}>{fmtK(calc.totalRevenue)}</div>
                <div style={{ fontSize:12, color:'rgba(10,31,18,0.5)', marginTop:8 }}>Ledger + Verified Commencements</div>

                  <div className="report-row report-indent"><span>Cash Outflows (Investing)</span><span>({fmtK(calc.cashflow.investing.out)})</span></div>
                  <div className="report-row total"><span>Net Cash from Investing Activities</span><span>{fmtK(calc.cfInvesting)}</span></div>

                  <div className="report-row section-title">Financing Activities</div>
                  <div className="report-row report-indent"><span>Cash Inflows (Financing)</span><span>{fmtK(calc.cashflow.financing.in)}</span></div>
                  <div className="report-row report-indent"><span>Cash Outflows (Financing)</span><span>({fmtK(calc.cashflow.financing.out)})</span></div>
                  <div className="report-row total"><span>Net Cash from Financing Activities</span><span>{fmtK(calc.cfFinancing)}</span></div>

                  <div className="report-row total" style={{ fontSize:18, color: calc.netCashflow >= 0 ? '#1E7B3C' : '#B8564F' }}>
                    <span>Net Increase / (Decrease) in Cash</span>
                    <span>{fmtK(calc.netCashflow)}</span>
                  </div>
                  <div className="report-row report-indent" style={{ marginTop:12, borderTop:'1px solid #ccc', paddingTop:12 }}><span>Cash at Beginning of Period</span><span>{fmtK(0)}</span></div>
                  <div className="report-row total" style={{ fontSize:16 }}><span>Cash at End of Period</span><span>{fmtK(calc.netCashflow)}</span></div>
                </div>
              )}
            </div>
          </div>
        )}
      </main>

      {modal && (
        <FormModal
          modal={modal}
          onClose={closeModal}
          onSave={saveEntry}
          saving={saving}
          error={formError}
          clients={clients}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
