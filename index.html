<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Financial Support & Management | StartEasy Zambia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
  --forest:#0A1F12; --forest-2:#123A1F; --green:#1E7B3C; --orange:#E8730F; 
  --orange-2:#F5A623; --light:#F5FAF6; --red:#B8564F; --blue:#1B6CA8;
}
html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: var(--light); color: var(--forest); }
.serif { font-family: 'Playfair Display', Georgia, serif; }
.fadein { animation: fi .5s cubic-bezier(.22,.61,.36,1) both; }
@keyframes fi { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

/* Header & Nav */
.site-header { position: sticky; top: 0; z-index: 100; background: #0A1F12; border-bottom: 1px solid rgba(245,166,35,.1); width: 100%; }
.header-content { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 24px; }
.logo-group { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
.logo-mark { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; font-family: 'Playfair Display', serif; }
.logo-text-sub { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); font-weight: 700; }
.logo-text-main { font-size: 15px; font-weight: 700; color: #fff; }
.menu-toggle { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 4px; }
.nav-menu { position: absolute; top: 72px; right: 24px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 250px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(10,31,18,0.1); z-index: 100; }
.nav-item { padding: 14px 20px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: #0A1F12; text-decoration: none; border-bottom: 1px solid #eee; transition: background 0.2s; cursor: pointer; }
.nav-item:hover { background: #F5FAF6; }
.nav-item:last-child { border-bottom: none; color: #B8564F; }

/* Buttons */
.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: linear-gradient(135deg,#E8730F,#F5A623); color: #fff; padding: 14px 28px; font-size: 14.5px; text-decoration: none; box-shadow: 0 10px 26px rgba(232,115,15,.32); }
.btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 16px 34px rgba(232,115,15,.45); }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 9px; cursor: pointer; font-family: inherit; font-weight: 700; transition: all .2s; background: transparent; color: #fff; padding: 14px 28px; font-size: 14.5px; text-decoration: none; }
.btn-ghost:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }

/* Sections */
.section-padding { padding: 80px 24px; }
.container { max-width: 1240px; margin: 0 auto; width: 100%; }

/* Interactive Elements */
.gtile { background: #fff; border: 2px solid rgba(10,31,18,.1); border-radius: 12px; padding: 24px; text-align: left; cursor: pointer; font-family: inherit; transition: all .22s; display: flex; flex-direction: column; gap: 12px; position: relative; }
.gtile:hover { border-color: #E8730F; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,.07); }
.gtile.sel { border-color: #E8730F; background: linear-gradient(135deg,rgba(232,115,15,.06),rgba(245,166,35,.03)); box-shadow: 0 0 0 4px rgba(232,115,15,.12); }
.gtile .ico { width: 44px; height: 44px; border-radius: 10px; background: rgba(232,115,15,.1); color: #E8730F; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
.gtile.sel .ico { background: #E8730F; color: #fff; }
.gtile h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #0A1F12; line-height: 1.25; margin: 0; }
.gtile p { font-size: 13px; color: rgba(10,31,18,.6); line-height: 1.5; margin: 0; }

.pricing-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; position: relative; transition: all 0.3s; }
.pricing-card.popular { border: 2px solid #E8730F; box-shadow: 0 20px 40px rgba(232,115,15,0.1); }
.pricing-card.highlighted { border: 2px solid #1E7B3C; box-shadow: 0 0 0 4px rgba(30,123,60,0.15); transform: scale(1.02); z-index: 10; }
.pricing-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: #E8730F; color: #fff; padding: 4px 16px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }

.check-list { list-style: none; padding: 0; margin: 0; }
.check-list li { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; font-size: 14px; color: rgba(10,31,18,0.8); line-height: 1.5; }
.check-list li i { color: #1E7B3C; margin-top: 3px; font-size: 14px; }

.step-number { width: 48px; height: 48px; border-radius: 50%; background: #0A1F12; color: #F5A623; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; margin-bottom: 16px; flex-shrink: 0; font-family: 'Playfair Display', Georgia, serif; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10,31,18,0.88); }
.modal-content { background: #F5FAF6; border-radius: 12px; width: 100%; max-width: 56rem; max-height: 92vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.modal-header { background: #0A1F12; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(245,166,35,.15); }
.modal-body { padding: 32px; }

/* Legal Document Styling */
.el { background:#fff; border:1px solid #D0D0D0; border-radius:8px; padding:40px 50px; font-size:13.5px; line-height:1.8; color:#222; box-shadow: 0 10px 30px rgba(0,0,0,.05); width: 100%; margin: 0 auto; }
.el .eh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid #0A1F12;margin-bottom:24px;flex-wrap:wrap}
.el .eh .brand{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;color:#0A1F12;letter-spacing:1px}
.el .eh .brand em{font-style:normal;color:#E8730F}
.el .eh .sub{font-size:10.5px;color:#8A6828;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-top:4px}
.el .eh .dt{font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:800;color:#E8730F;letter-spacing:1.2px;text-align:right}
.el .eh .mt{font-size:11.5px;color:#666;text-align:right;margin-top:6px}
.el h4{font-family:'Playfair Display',Georgia,serif;font-size:16.5px;color:#0A1F12;font-weight:700;margin:28px 0 12px; border-bottom: 1px solid #eee; padding-bottom: 6px;}
.el h4:first-of-type{margin-top:0}
.el p{margin:0 0 16px; text-align: justify;}
.el ul{margin:0 0 18px;padding-left:24px}
.el li{margin-bottom:12px;font-size:13.5px; text-align: justify;}
.el .highlight-box{background:#F9FBFA; border-left:4px solid #E8730F; padding:18px; margin-bottom:24px; font-size:13.5px; font-weight:500;}
.el .sign{margin-top:36px;padding-top:24px;border-top:1px solid #E0E0E0;display:grid;grid-template-columns:1fr 1fr;gap:40px; width: 100%;}
@media (max-width: 600px) { .el .sign { grid-template-columns: 1fr; gap: 24px; } }
.el .sign .sigval{font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;color:#0A1F12;letter-spacing:.04em;font-style:italic;padding-bottom:8px;border-bottom:1px solid #333;margin-bottom:10px;min-height:40px}
.el .sign .lbl{font-size:11px;color:#666;font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
.doc-input-line { border-bottom: 1px dashed #999; padding: 0 4px; font-family: inherit; font-size:14px; color: var(--forest); background: #F9FBFA; border-top: none; border-left: none; border-right: none; width: 100%; margin-top: 4px; padding: 8px; transition: all 0.2s;}
.doc-input-line:focus { background: #fff; border-bottom: 2px solid var(--orange); outline: none; }

.inp { width: 100%; background: #fff; border: 1px solid rgba(10,31,18,.15); border-radius: 8px; padding: 12px 16px; font-size: 14px; color: #0A1F12; font-family: inherit; transition: all .2s; }
.inp:focus { outline: none; border-color: #E8730F; box-shadow: 0 0 0 3px rgba(232,115,15,.1); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const WHATSAPP_NUMBER = '260762499581';
const waUrl = (msg) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

const PACKAGES = [
  {
    id: 'starter',
    title: 'Financial Starter',
    price: 'K750 – K1,250',
    audience: 'For sole traders, startups and microbusinesses.',
    desc: 'Establishing clean financial records and a basic cash position.',
    features: [
      'Income and expense recording',
      'Sales and purchase tracking',
      'Invoice preparation and payment register',
      'Monthly income and expense summary',
      'Basic cash position report'
    ],
    outcome: 'Organised financial records and a clearer picture of where the money goes.',
    timeline: 'Ongoing monthly'
  },
  {
    id: 'control',
    title: 'Business Control',
    price: 'K1,500 – K2,500',
    audience: 'For active SMEs with regular transactions.',
    popular: true,
    desc: 'Taking full control of cash flow, budgets, and monthly performance.',
    features: [
      'Everything in Starter, plus:',
      'Monthly budget preparation',
      'Cash-flow monitoring',
      'Receivables and payables tracking',
      'Monthly management report',
      'Budget-versus-actual review',
      'Monthly financial review meeting'
    ],
    outcome: 'Better control over cash flow, expenses and business performance.',
    timeline: 'Ongoing monthly'
  },
  {
    id: 'growth',
    title: 'Growth & Financial Planning',
    price: 'K3,000 – K5,000',
    audience: 'For growing SMEs and businesses preparing to expand.',
    desc: 'Forecasting, funding readiness, and strategic financial planning.',
    features: [
      'Everything in Business Control, plus:',
      'Rolling cash-flow forecasts',
      'Quarterly financial planning',
      'Growth budgets and financial scenarios',
      'Financial performance analysis',
      'Funding-readiness assessment',
      'Preparation of financial info for funders'
    ],
    outcome: 'More informed growth decisions and better-organised financial information.',
    timeline: 'Ongoing monthly'
  }
];

const PROJECTS = [
  "Business budget preparation",
  "Cash-flow forecast",
  "Financial records clean-up",
  "Financial performance review",
  "Invoice management setup",
  "Funding-readiness preparation",
  "Business financial plan"
];

function App() {
  const [isMenuOpen, setIsMenuOpen] = useState(false);
  
  // Engagement State
  const [selectedItem, setSelectedItem] = useState(null);
  const [form, setForm] = useState({ name: '', email: '', phone: '' });
  const [agreed, setAgreed] = useState(false);
  const [error, setError] = useState('');
  const [isSuccess, setIsSuccess] = useState(false);

  // Self-orientation state
  const [orientation, setOrientation] = useState(null);

  useEffect(() => {
    if (selectedItem) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';
    return () => { document.body.style.overflow = ''; };
  }, [selectedItem]);

  const openEngagement = (item) => {
    setSelectedItem(item);
    setForm({ name: '', email: '', phone: '' });
    setAgreed(false);
    setError('');
    setIsSuccess(false);
  };

  const closeEngagement = () => {
    setSelectedItem(null);
  };

  const handleProceed = () => {
    setError('');
    if (!form.name.trim()) return setError('Please enter your full name to sign.');
    if (!form.email.trim()) return setError('Please enter your email address.');
    if (!agreed) return setError('Please check the box to accept the terms.');
    setIsSuccess(true);
  };

  const handleOrientation = (type, targetId) => {
    setOrientation(type);
    setTimeout(() => {
      const el = document.getElementById(targetId);
      if (el) {
        const y = el.getBoundingClientRect().top + window.scrollY - 100;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }, 100);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', width: '100%' }}>
      
      {/* Header */}
      <header className="site-header">
        <div className="header-content">
          <a href="#" className="logo-group">
            <div className="logo-mark">S</div>
            <div>
              <div className="logo-text-sub">Business Support</div>
              <div className="logo-text-main">StartEasy Zambia</div>
            </div>
          </a>
          <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
            <a href="#contact" className="btn-primary hidden sm:inline-flex" style={{ padding: '10px 20px', fontSize: 13 }}>Get Started</a>
            <button className="menu-toggle" onClick={() => setIsMenuOpen(!isMenuOpen)}>
              <i className={`fas ${isMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
            </button>
          </div>
        </div>
        {isMenuOpen && (
          <div className="nav-menu fadein">
            <a href="#home" className="nav-item" onClick={() => setIsMenuOpen(false)}><i className="fas fa-home text-gray-400"></i> Home</a>
            <a href="#orientation" className="nav-item" onClick={() => setIsMenuOpen(false)}><i className="fas fa-compass text-gray-400"></i> Find Your Plan</a>
            <a href="#packages" className="nav-item" onClick={() => setIsMenuOpen(false)}><i className="fas fa-box text-gray-400"></i> Monthly Packages</a>
            <a href="#projects" className="nav-item" onClick={() => setIsMenuOpen(false)}><i className="fas fa-file-alt text-gray-400"></i> One-Time Projects</a>
            <a href="#process" className="nav-item" onClick={() => setIsMenuOpen(false)}><i className="fas fa-route text-gray-400"></i> How We Work</a>
          </div>
        )}
      </header>

      <main style={{ flex: 1, background: '#F5FAF6', width: '100%' }}>
        
        {/* Hero Section */}
        <section id="home" className="fadein" style={{ background: 'linear-gradient(135deg,#0A1F12 0%,#123A1F 100%)', color: '#fff', padding: '100px 24px', textAlign: 'center', width: '100%' }}>
          <div className="container" style={{ maxWidth: 900 }}>
            <span style={{ display: 'inline-block', background: 'rgba(232,115,15,0.2)', color: '#F5A623', padding: '6px 16px', borderRadius: 99, fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 24 }}>
              Financial Support & Management
            </span>
            <h1 className="serif" style={{ fontSize: 'clamp(2.5rem,6vw,4rem)', lineHeight: 1.1, marginBottom: 24 }}>
              Take control of your <br/><em style={{ fontStyle: 'italic', color: '#F5A623' }}>business finances.</em>
            </h1>
            <h2 style={{ fontSize: 'clamp(1.2rem,3vw,1.6rem)', fontWeight: 600, color: 'rgba(255,255,255,0.9)', marginBottom: 24 }}>
              Make better decisions. Plan for growth.
            </h2>
            <p style={{ fontSize: 17, lineHeight: 1.7, color: 'rgba(255,255,255,0.75)', marginBottom: 40, maxWidth: 750, margin: '0 auto 40px' }}>
              We provide practical financial management and administrative support to help entrepreneurs and businesses organise their financial records, monitor cash flow, manage expenses and prepare for growth.
            </p>
            <div style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap' }}>
              <a href="#orientation" className="btn-primary">Find Your Plan <i className="fas fa-arrow-right" style={{ fontSize: 12 }}></i></a>
              <a href="#packages" className="btn-ghost">View All Packages</a>
            </div>
          </div>
        </section>

        {/* Self-Orientation Section */}
        <section id="orientation" className="section-padding" style={{ background: '#fff', borderBottom: '1px solid #eee' }}>
          <div className="container" style={{ maxWidth: 900, textAlign: 'center' }}>
            <h2 className="serif" style={{ fontSize: 32, color: '#0A1F12', marginBottom: 12 }}>Where is your business right now?</h2>
            <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.6)', marginBottom: 40 }}>Select the option that best describes you, and we'll highlight the perfect plan.</p>
            
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: 20 }}>
              <button 
                className={`gtile ${orientation === 'starter' ? 'sel' : ''}`} 
                onClick={() => handleOrientation('starter', 'pkg-starter')}
              >
                <div className="ico"><i className="fas fa-seedling"></i></div>
                <h3>Just Starting Out</h3>
                <p>I'm a sole trader or new microbusiness trying to get my records in order.</p>
              </button>

              <button 
                className={`gtile ${orientation === 'control' ? 'sel' : ''}`} 
                onClick={() => handleOrientation('control', 'pkg-control')}
              >
                <div className="ico"><i className="fas fa-store"></i></div>
                <h3>Active Business</h3>
                <p>I'm an SME with regular transactions and need better control over cash flow.</p>
              </button>

              <button 
                className={`gtile ${orientation === 'growth' ? 'sel' : ''}`} 
                onClick={() => handleOrientation('growth', 'pkg-growth')}
              >
                <div className="ico"><i className="fas fa-chart-line"></i></div>
                <h3>Preparing to Expand</h3>
                <p>I'm growing and need forecasts, budgets, and funding readiness.</p>
              </button>
            </div>
          </div>
        </section>

        {/* Monthly Packages */}
        <section id="packages" className="section-padding">
          <div className="container">
            <div style={{ textAlign: 'center', marginBottom: 60 }}>
              <h2 className="serif" style={{ fontSize: 36, color: '#0A1F12', marginBottom: 16 }}>Monthly Support Packages</h2>
              <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.6)', maxWidth: 650, margin: '0 auto' }}>
                Choose the level of support that matches your business requirements. All packages include strict transaction-volume limits to ensure quality.
              </p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 24, alignItems: 'stretch' }}>
              {PACKAGES.map(pkg => (
                <div key={pkg.id} id={`pkg-${pkg.id}`} className={`pricing-card ${pkg.popular ? 'popular' : ''} ${orientation === pkg.id ? 'highlighted' : ''}`} style={{ transition: 'all 0.3s' }}>
                  {pkg.popular && <div className="pricing-badge">Most Popular</div>}
                  <h3 style={{ fontSize: 20, fontWeight: 800, color: '#0A1F12', marginBottom: 4 }}>{pkg.title}</h3>
                  <p style={{ fontSize: 13, color: 'rgba(10,31,18,0.6)', marginBottom: 16 }}>{pkg.audience}</p>
                  <div style={{ fontSize: 24, fontWeight: 800, color: '#E8730F', marginBottom: 24 }}>{pkg.price} <span style={{ fontSize: 14, fontWeight: 500, color: '#666' }}>/ month</span></div>
                  
                  <ul className="check-list" style={{ flexGrow: 1 }}>
                    {pkg.features.map((f, i) => (
                      <li key={i}><i className={`fas fa-check-circle ${f.includes('Everything') ? 'text-orange-500' : ''}`}></i> {f}</li>
                    ))}
                  </ul>
                  
                  <div style={{ marginTop: 24, paddingTop: 16, borderTop: '1px solid #eee', fontSize: 13, fontStyle: 'italic', color: '#555', marginBottom: 20 }}>
                    <strong>Outcome:</strong> {pkg.outcome}
                  </div>

                  <button onClick={() => openEngagement(pkg)} className="btn-primary" style={{ width: '100%' }}>Select Plan</button>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* One-Time Projects */}
        <section id="projects" className="section-padding" style={{ background: '#fff' }}>
          <div className="container">
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 48, alignItems: 'center' }}>
              <div>
                <h2 className="serif" style={{ fontSize: 32, color: '#0A1F12', marginBottom: 20 }}>Financial Support Projects</h2>
                <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.7)', lineHeight: 1.7, marginBottom: 24 }}>
                  Not every customer is ready for a monthly subscription. Some need one specific financial task completed. These are quoted individually after assessing your records, complexity, and required turnaround time.
                </p>
                <div style={{ background: '#F5FAF6', padding: 24, borderRadius: 12, borderLeft: '4px solid #1E7B3C' }}>
                  <p style={{ fontSize: 14, fontWeight: 600, margin: 0, color: '#0A1F12' }}>
                    <i className="fas fa-lightbulb" style={{ color: '#1E7B3C', marginRight: 8 }}></i>
                    <strong>Sales Opportunity:</strong> A customer who purchases a one-time budget or forecast can subsequently be converted into a monthly Business Control customer.
                  </p>
                </div>
              </div>
              <div style={{ display: 'grid', gap: 12 }}>
                {PROJECTS.map((item, i) => (
                  <button 
                    key={i} 
                    onClick={() => openEngagement({ title: item, price: 'Quoted individually', features: [`Dedicated execution of ${item}.`] })}
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: '#fff', border: '1px solid #eee', padding: '16px 20px', borderRadius: 8, boxShadow: '0 2px 4px rgba(0,0,0,0.02)', cursor: 'pointer', transition: 'all 0.2s', textAlign: 'left' }}
                    onMouseEnter={e => e.currentTarget.style.borderColor = '#E8730F'}
                    onMouseLeave={e => e.currentTarget.style.borderColor = '#eee'}
                  >
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                      <i className="fas fa-file-alt" style={{ color: '#E8730F' }}></i>
                      <span style={{ fontSize: 15, fontWeight: 600, color: '#0A1F12' }}>{item}</span>
                    </div>
                    <i className="fas fa-arrow-right" style={{ color: '#ccc', fontSize: 12 }}></i>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </section>

        {/* Delivery Process & Monthly Deliverables */}
        <section id="process" className="section-padding">
          <div className="container">
            <div style={{ textAlign: 'center', marginBottom: 60 }}>
              <h2 className="serif" style={{ fontSize: 36, color: '#0A1F12', marginBottom: 16 }}>How We Deliver</h2>
              <p style={{ fontSize: 16, color: 'rgba(10,31,18,0.6)', maxWidth: 600, margin: '0 auto' }}>
                A sellable service needs a repeatable delivery process.
              </p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 32, marginBottom: 60 }}>
              {[
                { step: '1', title: 'Enquiry & Selection', desc: 'Customer selects a package or requests a specific project.' },
                { step: '2', title: 'Initial Assessment', desc: 'StartEasy reviews the business nature, transaction volume, records, and challenges.' },
                { step: '3', title: 'Onboarding & Docs', desc: 'Customer completes onboarding form and provides records via secure channel.' },
                { step: '4', title: 'Agreement & Payment', desc: 'Confirm package, deliverables, frequency, price, and terms.' },
                { step: '5', title: 'Support Delivery', desc: 'Assigned officer maintains records, prepares schedules, and monitors financials.' },
                { step: '6', title: 'Reporting & Review', desc: 'Customer receives agreed reports with brief explanations and actions to consider.' },
                { step: '7', title: 'Renewal & Upgrade', desc: 'As the business grows, StartEasy recommends higher packages or extra services.' }
              ].map((item, i) => (
                <div key={i} style={{ display: 'flex', gap: 16 }}>
                  <div className="step-number">{item.step}</div>
                  <div>
                    <h4 style={{ fontSize: 16, fontWeight: 700, marginBottom: 4, color: '#0A1F12' }}>{item.title}</h4>
                    <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.7)', lineHeight: 1.5 }}>{item.desc}</p>
                  </div>
                </div>
              ))}
            </div>

            <div style={{ background: '#fff', borderRadius: 16, padding: 40, border: '1px solid #eee', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 40 }}>
              <div>
                <h3 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 16 }}>What You Receive Every Month</h3>
                <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.7)', lineHeight: 1.6, marginBottom: 16 }}>
                  Do not just expect bookkeeping. Expect identifiable deliverables. For example, a <strong>Business Control</strong> customer receives:
                </p>
              </div>
              <div>
                <ul className="check-list">
                  <li><i className="fas fa-check-circle"></i> Monthly income and expenditure statement</li>
                  <li><i className="fas fa-check-circle"></i> Cash-flow position and forecast</li>
                  <li><i className="fas fa-check-circle"></i> Outstanding customer invoices</li>
                  <li><i className="fas fa-check-circle"></i> Outstanding supplier payments</li>
                  <li><i className="fas fa-check-circle"></i> Budget-versus-actual report</li>
                  <li><i className="fas fa-check-circle"></i> A short financial observations and recommendations summary</li>
                </ul>
              </div>
            </div>
          </div>
        </section>

        {/* CTA Footer */}
        <section id="contact" style={{ background: '#0A1F12', padding: '80px 24px', textAlign: 'center' }}>
          <div className="container">
            <h2 className="serif" style={{ fontSize: 32, color: '#fff', marginBottom: 16 }}>Ready to take control?</h2>
            <p style={{ fontSize: 16, color: 'rgba(255,255,255,0.7)', marginBottom: 32, maxWidth: 600, margin: '0 auto 32px' }}>
              Let's discuss how we can support your financial administration. Whether you're a startup, entrepreneur or growing SME, we're here to support your next step.
            </p>
            <a href={waUrl('Hello StartEasy, I would like to discuss Financial Support for my business.')} target="_blank" rel="noopener noreferrer" className="btn-primary" style={{ fontSize: 16, padding: '16px 40px' }}>
              <i className="fab fa-whatsapp" style={{ marginRight: 8 }}></i> Chat with an Officer
            </a>
          </div>
        </section>

      </main>

      <footer style={{ background: '#0A1F12', padding: '40px 24px', textAlign: 'center', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13 }}>© {new Date().getFullYear()} StartEasy Zambia. All rights reserved.</p>
      </footer>

      {/* ─── ENGAGEMENT PROPOSAL MODAL (LEGAL DOCUMENT) ─── */}
      {selectedItem && (
        <div className="modal-overlay mf" onClick={closeEngagement}>
          <div className="modal-content mc" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#F5A623' }}></span>
                <span style={{ fontSize: 11, letterSpacing: '.2em', textTransform: 'uppercase', fontWeight: 700, color: '#F5A623' }}>Engagement Proposal</span>
              </div>
              <button onClick={closeEngagement} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,.5)', cursor: 'pointer' }}>
                <i className="fas fa-times"></i>
              </button>
            </div>
            
            <div className="modal-body" style={{ background: '#F5FAF6' }}>
              
              {!isSuccess ? (
                <>
                  {/* THE LEGAL DOCUMENT */}
                  <div className="el">
                    <div className="eh">
                      <div>
                        <div className="brand">Start<em>Easy Zambia</em></div>
                        <div className="sub">Financial Support Engagement</div>
                      </div>
                      <div>
                        <div className="dt">AGREEMENT OF ENGAGEMENT</div>
                        <div className="mt">{new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}<br/>Ref: SE-FIN-{new Date().getFullYear()}-{Math.floor(Math.random()*9000)+1000}</div>
                      </div>
                    </div>
                    
                    <p>This Agreement of Engagement (the "Agreement") is entered into by and between <strong>StartEasy Zambia</strong> (the "Company") and the undersigned Client (the "Client").</p>

                    <h4>1. Scope of Service</h4>
                    <p>The Company hereby agrees to provide the following financial support service: <strong>{selectedItem.title}</strong>.</p>
                    <p>{selectedItem.desc || "Dedicated execution of the requested financial task."}</p>
                    
                    <p><strong>Specifically, the Company will deliver:</strong></p>
                    <ul>
                      {selectedItem.features.map((f, i) => (
                        <li key={i}>{f}</li>
                      ))}
                    </ul>

                    <h4>2. Compensation</h4>
                    <p>In consideration of the services rendered, the Client shall pay the Company the following fee:</p>
                    <div className="highlight-box">
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span style={{ fontWeight: 600 }}>Service Fee</span>
                        <span style={{ fontSize: 20, fontWeight: 800, color: '#E8730F' }}>{selectedItem.price} {selectedItem.features.length > 2 ? '/ month' : ''}</span>
                      </div>
                    </div>
                    <p style={{ fontSize: 12, fontStyle: 'italic', color: '#666' }}>All amounts are StartEasy service fees for administrative work only. They do not include any government or regulator fee.</p>

                    <h4>3. Terms and Conditions</h4>
                    <ul>
                      <li><strong>No Employment Relationship:</strong> This Agreement does not create an employer-employee relationship. The Company operates as an independent contractor.</li>
                      <li><strong>Confidentiality:</strong> The Company will have access to sensitive financial data. We will never disclose this information to third parties.</li>
                      <li><strong>Limitation of Liability:</strong> The Company provides administrative and management support. We are not a licensed accounting or audit firm. We do not provide legal or tax advisory services.</li>
                      <li><strong>Termination:</strong> Either party may terminate this agreement with 30 days written notice.</li>
                    </ul>

                    <h4>4. Client Details & Execution</h4>
                    <p>By signing below, the Client acknowledges that they have read, understood, and agree to be bound by the terms of this Agreement.</p>
                    
                    <div style={{ display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', marginTop: 20, marginBottom: 20 }}>
                      <div>
                        <label style={{ display: 'block', fontSize: 11, fontWeight: 700, color: '#666', textTransform: 'uppercase', marginBottom: 6 }}>Full Name</label>
                        <input type="text" className="inp doc-input-line" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Enter full name" />
                      </div>
                      <div>
                        <label style={{ display: 'block', fontSize: 11, fontWeight: 700, color: '#666', textTransform: 'uppercase', marginBottom: 6 }}>Email Address</label>
                        <input type="email" className="inp doc-input-line" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="you@company.com" />
                      </div>
                      <div style={{ gridColumn: '1 / -1' }}>
                        <label style={{ display: 'block', fontSize: 11, fontWeight: 700, color: '#666', textTransform: 'uppercase', marginBottom: 6 }}>Phone Number</label>
                        <input type="tel" className="inp doc-input-line" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} placeholder="+260..." />
                      </div>
                    </div>

                    <div className="sign">
                      <div>
                        <div className="sigval" style={{ color: '#1B6CA8' }}>Mwaba Lewis</div>
                        <div className="lbl">For StartEasy Zambia</div>
                      </div>
                      <div>
                        <div className="sigval" style={{ color: '#E8730F' }}>{form.name || '_________________________'}</div>
                        <div className="lbl">For the Client</div>
                      </div>
                    </div>
                  </div>

                  {/* Actions */}
                  <div style={{ marginTop: 24, background: '#fff', padding: 24, borderRadius: 12, border: '1px solid #eee' }}>
                    <label style={{ display: 'flex', gap: 12, alignItems: 'flex-start', cursor: 'pointer', marginBottom: 20 }}>
                      <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} style={{ width: 20, height: 20, accentColor: '#E8730F', marginTop: 2 }} />
                      <span style={{ fontSize: 13.5, color: 'rgba(10,31,18,0.8)', lineHeight: 1.5, fontWeight: 600 }}>
                        I have read, understood, and agree to the terms of this engagement proposal. I confirm that I am authorized to sign on behalf of my business.
                      </span>
                    </label>

                    {error && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 6, marginBottom: 16, fontSize: 13, fontWeight: 600 }}>{error}</div>}

                    <div style={{ display: 'flex', gap: 12 }}>
                      <button onClick={handleProceed} className="btn-primary" style={{ flex: 1, padding: '16px' }}>
                        <i className="fas fa-check-circle"></i> Execute Agreement
                      </button>
                      <button onClick={closeEngagement} style={{ padding: '16px 24px', background: '#fff', border: '1px solid #ccc', borderRadius: 9, fontWeight: 600, cursor: 'pointer' }}>Cancel</button>
                    </div>
                  </div>
                </>
              ) : (
                <div style={{ textAlign: 'center', padding: '40px 20px', background: '#fff', borderRadius: 12 }}>
                  <div style={{ width: 64, height: 64, borderRadius: '50%', background: '#EAF7EE', color: '#1E7B3C', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, margin: '0 auto 24px' }}>
                    <i className="fas fa-file-signature"></i>
                  </div>
                  <h2 className="serif" style={{ fontSize: 28, color: '#0A1F12', marginBottom: 12 }}>Agreement Executed!</h2>
                  <p style={{ fontSize: 15, color: 'rgba(10,31,18,0.7)', marginBottom: 24, lineHeight: 1.6, maxWidth: 500, margin: '0 auto 24px' }}>
                    Your engagement proposal has been generated. Please send the confirmation to our officer on WhatsApp to finalize your booking and receive payment instructions.
                  </p>
                  <a href={waUrl(`*SIGNED ENGAGEMENT PROPOSAL*\n\n*Client:* ${form.name}\n*Email:* ${form.email}\n*Phone:* ${form.phone || 'N/A'}\n\n*Service:* ${selectedItem.title}\n*Price:* ${selectedItem.price}\n\nI have read, understood, and agreed to the terms of this engagement. Please confirm my booking.`)} target="_blank" rel="noopener noreferrer" className="btn-primary" style={{ display: 'inline-flex', width: '100%', maxWidth: 320, marginBottom: 16, background: '#25D366', boxShadow: '0 10px 26px rgba(37,211,102,.32)' }}>
                    <i className="fab fa-whatsapp"></i> Send to Officer on WhatsApp
                  </a>
                  <br/>
                  <button onClick={closeEngagement} style={{ background: 'none', border: 'none', color: '#666', textDecoration: 'underline', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}>Close and return</button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
