.el .feebox .v{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:800;color:#0A1F12;white-space:nowrap}

.admin-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.admin-nav-item { padding: 16px 24px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
.admin-nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.admin-nav-item.active { background: rgba(245,166,35,0.1); color: #F5A623; border-left-color: #F5A623; }
.admin-content { padding: 32px; flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; }
.admin-card { background: #fff; border-radius: 12px; border: 1px solid #E2E8F0; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 800px; }
.admin-table th { text-align: left; padding: 16px; background: #F8FAFC; border-bottom: 1px solid #E2E8F0; font-weight: 700; color: #64748B; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; white-space: nowrap; }

.status-pill { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }

.auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A1F12; padding: 24px; }
.auth-box { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,0.4); }
.auth-input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 16px; font-family: inherit; }

@media (max-width: 768px) {

  .el .eh { flex-direction: column; gap: 12px; }

  .el .sign { grid-template-columns: 1fr; gap: 24px; }
  .modal-body { padding: 16px; }
}
</style>

  {

    features: ['Everything in Business Control, plus:','Rolling cash-flow forecasts','Quarterly financial planning','Growth budgets and financial scenarios','Financial performance analysis','Funding-readiness assessment','Preparation of financial info for funders'],
    outcome: 'More informed growth decisions and better-organised financial information.', timeline: 'Ongoing monthly'
  }
];

function App() {

  const [selectedItem, setSelectedItem] = useState(null);
  const [form, setForm] = useState({ name: '', email: '', phone: '', business: '', location: '' });

    if (selectedItem) document.body.style.overflow = 'hidden';
    else document.body.style.overflow = '';

    setAgreed(false);
    setError('');

    setSelectedItem(null);

    setError('');

  const handleOrientation = (type, targetId) => {
    setOrientation(type);
    setTimeout(() => {

    const half = rawNum / 2;
    const format = (n) => `K${n.toLocaleString()}`;
    return { total: priceStr, commencement: format(half), balance: format(half) };
  };

  const fees = selectedItem ? getFeeBreakdown(selectedItem.price) : { total: '', commencement: '', balance: '' };

  if (view === 'admin') {

/* ═══════════════════════════════════════════════════════════════════════
   ADMIN PORTAL COMPONENT (SECURE, LIVE, RESPONSIVE)
   ═══════════════════════════════════════════════════════════════════════ */
function AdminPortal({ onExit }) {
  const [user, setUser] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [authError, setAuthError] = useState('');
  const [authLoading, setAuthLoading] = useState(true);
  
  const [payments, setPayments] = useState([]);
  const [loadingData, setLoadingData] = useState(true);
  
  // Navigation State
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [activeTab, setActiveTab] = useState('overview');

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        setUser(u);
        try {
          const snap = await db.collection('se_admins').doc(u.uid).get();
          setIsAdmin(snap.exists);
          if (!snap.exists) setAuthError('Access denied. You are not an authorized admin.');
        } catch (e) {
          setAuthError('Error verifying admin status: ' + e.message);
        }
      } else {
        setUser(null);
        setIsAdmin(false);
      }
      setAuthLoading(false);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!isAdmin) return;
    const unsub = db.collection('se_payments')
      .orderBy('submittedAt', 'desc')
      .limit(50)
      .onSnapshot(snap => {
        const rawPayments = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        // --- FILTER OUT THE FAKE / TEST DATA ---
        const filteredPayments = rawPayments.filter(p => {
          const email = (p.clientEmail || '').toLowerCase();
          const name = (p.clientName || '').toLowerCase();
          const service = (p.serviceTitle || '').toLowerCase();
          
          const blacklistedEmails = ['naisainga@gmail.com', 'lewismwaba@gmail.com', 'moneyard2@gmail.com'];
          const blacklistedNames = ['lewis mwaba', 'mwaba lewis', 'katongo mercy'];
          
          if (blacklistedEmails.includes(email)) return false;
          if (blacklistedNames.includes(name)) return false;
          if (service.includes('buyer access subscription')) return false;
          
          return true;
        });

        setPayments(filteredPayments);
        setLoadingData(false);
      }, err => {
        console.error("Error fetching payments:", err);
        setLoadingData(false);
      });
    return unsub;
  }, [isAdmin]);

  const handleLogin = async (e) => {
    e.preventDefault();
    setAuthError('');
    setAuthLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      setAuthError(err.message);
      setAuthLoading(false);
    }
  };

  const handleLogout = () => {
    auth.signOut();
    // onExit() will be called by the auth listener if needed, but we can force it here too
  };

  const handleVerify = async (paymentId) => {
    try {
      await db.collection('se_payments').doc(paymentId).update({
        status: 'approved',
        verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('Payment verified and client is now active.');
    } catch (err) {
      alert('Failed to verify: ' + err.message);
    }
  };

  const handleDelete = async (paymentId) => {
    if (!window.confirm("Are you sure you want to permanently delete this record? This cannot be undone.")) return;
    try {
      await db.collection('se_payments').doc(paymentId).delete();
    } catch (err) {
      alert('Failed to delete: ' + err.message);
    }
  };

  const calculateCommencement = (amountStr) => {
    if (!amountStr) return 'N/A';
    const numMatch = String(amountStr).match(/[\d,]+/);
    if (!numMatch) return amountStr;
    const rawNum = parseInt(numMatch[0].replace(/,/g, ''), 10);
    return `K${(rawNum / 2).toLocaleString()}`;
  };

  if (authLoading) {
    return <div className="auth-gate"><i className="fas fa-circle-notch fa-spin" style={{ color: '#F5A623', fontSize: 32 }}></i></div>;
  }

  if (!user || !isAdmin) {
    return (
      <div className="auth-gate fadein">
        <div className="auth-box">
          <div style={{ textAlign: 'center', marginBottom: 24 }}>
            <div className="logo-mark" style={{ margin: '0 auto 16px', width: 48, height: 48, fontSize: 22 }}>S</div>
            <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', margin: 0 }}>Finance Admin Portal</h2>
            <p style={{ fontSize: 14, color: 'rgba(10,31,18,0.6)', marginTop: 8 }}>Authorized personnel only</p>
          </div>
          {authError && <div style={{ background: '#FFE8E5', color: '#B8564F', padding: 12, borderRadius: 8, fontSize: 13, marginBottom: 16, fontWeight: 600 }}><i className="fas fa-exclamation-circle"></i> {authError}</div>}
          <form onSubmit={handleLogin}>
            <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: '#0A1F12', marginBottom: 6 }}>Admin Email</label>
            <input type="email" className="auth-input" value={email} onChange={e => setEmail(e.target.value)} required placeholder="admin@starteasyzambia.com" />
            <label style={{ display: 'block', fontSize: 12, fontWeight: 700, color: '#0A1F12', marginBottom: 6 }}>Password</label>
            <input type="password" className="auth-input" value={password} onChange={e => setPassword(e.target.value)} required placeholder="••••••••••" />
            <button type="submit" className="btn-primary" style={{ width: '100%', padding: '14px', marginTop: 8 }}><i className="fas fa-lock-open"></i> Secure Login</button>
          </form>
          <button onClick={onExit} style={{ width: '100%', background: 'none', border: 'none', color: '#666', fontSize: 13, marginTop: 16, cursor: 'pointer', textDecoration: 'underline' }}>Return to Public Page</button>
        </div>
      </div>
    );
  }

  const pendingPayments = payments.filter(p => p.status === 'under_review' || !p.status);
  const totalCollected = payments.filter(p => p.status === 'approved').reduce((sum, p) => {
    const amt = parseInt(String(p.amount).replace(/[^\d]/g, '')) || 0;
    return sum + (amt / 2);
  }, 0);

  return (
    <div className="admin-layout fadein">
      {/* Top Bar with Hamburger and Logout */}
      <div className="admin-top-bar">
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <button className="admin-hamburger" onClick={() => setIsDrawerOpen(true)}>
            <i className="fas fa-bars"></i>
            <span className="hidden sm:inline">Finance Admin</span>
          </button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <span className="hidden sm:inline" style={{ fontSize: 13, fontWeight: 600, color: 'rgba(10,31,18,0.6)' }}>{user.email}</span>
          <button onClick={handleLogout} style={{ background: 'rgba(184,86,79,0.1)', border: '1px solid #B8564F', color: '#B8564F', padding: '8px 16px', borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
            <i className="fas fa-sign-out-alt"></i> <span className="hidden sm:inline">Sign Out</span>
          </button>
        </div>
      </div>

      {/* Drawer Overlay */}
      <div className={`admin-drawer-overlay ${isDrawerOpen ? 'open' : ''}`} onClick={() => setIsDrawerOpen(false)}></div>

      {/* Drawer Menu */}
      <aside className={`admin-drawer ${isDrawerOpen ? 'open' : ''}`}>
        <div style={{ padding: '24px', borderBottom: '1px solid rgba(255,255,255,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div className="logo-mark" style={{ width: 32, height: 32, fontSize: 16 }}>S</div>
            <div>
              <div style={{ fontSize: 8, letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)', fontWeight: 700 }}>Finance System</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#fff' }}>StartEasy Zambia</div>
            </div>
          </div>
          <button onClick={() => setIsDrawerOpen(false)} style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', fontSize: 18 }}><i className="fas fa-times"></i></button>
        </div>

        <nav style={{ flex: 1, paddingTop: 16 }}>
          <div className={`admin-nav-item ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => { setActiveTab('overview'); setIsDrawerOpen(false); }}>
            <i className="fas fa-chart-pie"></i> Dashboard Overview
          </div>
          <div className={`admin-nav-item ${activeTab === 'queue' ? 'active' : ''}`} onClick={() => { setActiveTab('queue'); setIsDrawerOpen(false); }}>
            <i className="fas fa-money-check-alt"></i> Payment Queue ({pendingPayments.length})
          </div>
          <div className={`admin-nav-item ${activeTab === 'clients' ? 'active' : ''}`} onClick={() => { setActiveTab('clients'); setIsDrawerOpen(false); }}>
            <i className="fas fa-users"></i> Active Clients
          </div>
          <div className={`admin-nav-item ${activeTab === 'invoices' ? 'active' : ''}`} onClick={() => { setActiveTab('invoices'); setIsDrawerOpen(false); }}>
            <i className="fas fa-file-invoice"></i> Invoices
          </div>

        <div style={{ padding: 24, borderTop: '1px solid rgba(255,255,255,0.1)' }}>

            <i className="fas fa-sign-out-alt"></i> Sign Out
          </button>
        </div>
      </aside>

      {/* Main Content Area */}
      <main className="admin-content">
        
        {activeTab === 'overview' && (
          <div className="fadein">
            <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', marginBottom: 24 }}>Financial Overview</h1>
            
            {/* KPIs */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: 20, marginBottom: 32 }}>
              <div className="admin-card">
                <div style={{ fontSize: 11, fontWeight: 800, color: 'rgba(10,31,18,0.5)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Verified Commencement Fees</div>
                <div className="serif" style={{ fontSize: 32, fontWeight: 800, color: '#1E7B3C' }}>K{totalCollected.toLocaleString()}</div>
                <div style={{ fontSize: 12, color: 'rgba(10,31,18,0.5)', marginTop: 8 }}>From all approved clients</div>
              </div>
              <div className="admin-card">
                <div style={{ fontSize: 11, fontWeight: 800, color: 'rgba(10,31,18,0.5)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Pending Verifications</div>
                <div className="serif" style={{ fontSize: 32, fontWeight: 800, color: '#E8730F' }}>{pendingPayments.length}</div>
                <div style={{ fontSize: 12, color: 'rgba(10,31,18,0.5)', marginTop: 8 }}>Awaiting manual check</div>
              </div>
              <div className="admin-card">
                <div style={{ fontSize: 11, fontWeight: 800, color: 'rgba(10,31,18,0.5)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8 }}>Total Submissions</div>
                <div className="serif" style={{ fontSize: 32, fontWeight: 800, color: '#0A1F12' }}>{payments.length}</div>
                <div style={{ fontSize: 12, color: 'rgba(10,31,18,0.5)', marginTop: 8 }}>All time (last 50)</div>
              </div>
            </div>

            {/* Recent Queue Preview */}
            <div className="admin-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                <h2 style={{ fontSize: 18, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Recent Submissions</h2>
                <button onClick={() => setActiveTab('queue')} style={{ background: 'none', border: 'none', color: '#E8730F', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>View All →</button>
              </div>
              
              <div style={{ overflowX: 'auto' }}>
                <table className="admin-table">
                  <thead>
                    <tr>
                      <th>Client</th>
                      <th>Service</th>
                      <th>Amount</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {payments.slice(0, 5).map(p => (
                      <tr key={p.id}>
                        <td style={{ fontWeight: 700 }}>{p.clientName || 'Unknown'}</td>
                        <td>{p.serviceTitle || 'N/A'}</td>
                        <td style={{ fontWeight: 700 }}>{p.amount || 'N/A'}</td>
                        <td>
                          <span className={`status-pill ${p.status === 'approved' ? 'active' : 'pending'}`}>
                            {p.status === 'approved' ? 'Active' : 'Under Review'}
                          </span>
                        </td>
                      </tr>
                    ))}
                    {payments.length === 0 && (
                      <tr>
                        <td colSpan="4" style={{ textAlign: 'center', padding: 40, color: 'rgba(10,31,18,0.5)' }}>No real submissions yet.</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'queue' && (
          <div className="fadein">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
              <h1 className="serif" style={{ fontSize: 28, fontWeight: 800, color: '#0A1F12', margin: 0 }}>Payment Verification Queue</h1>
            </div>
            
            <div className="admin-card">
              {loadingData ? (
                <div style={{ textAlign: 'center', padding: '40px 0' }}><i className="fas fa-circle-notch fa-spin" style={{ color: '#E8730F', fontSize: 24 }}></i></div>
              ) : payments.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '40px 0', color: 'rgba(10,31,18,0.5)', fontSize: 14 }}>
                  <i className="fas fa-check-circle" style={{ fontSize: 32, color: '#1E7B3C', marginBottom: 12, display: 'block' }}></i>
                  No real payments found in the database.
                </div>
              ) : (
                <div style={{ overflowX: 'auto' }}>
                  <table className="admin-table">
                    <thead>
                      <tr>
                        <th>Client</th>
                        <th>Service</th>
                        <th>Total Fee</th>
                        <th>Commencement (50%)</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {payments.map(p => (
                        <tr key={p.id}>
                          <td>
                            <div style={{ fontWeight: 700 }}>{p.clientName || 'Unknown'}</div>
                            <div style={{ fontSize: 11, color: 'rgba(10,31,18,0.5)' }}>{p.clientEmail}</div>
                          </td>
                          <td>{p.serviceTitle || 'N/A'}</td>
                          <td style={{ fontWeight: 700 }}>{p.amount || 'N/A'}</td>
                          <td style={{ fontWeight: 800, color: '#E8730F' }}>{calculateCommencement(p.amount)}</td>
                          <td>
                            <span className={`status-pill ${p.status === 'approved' ? 'active' : 'pending'}`}>
                              {p.status === 'approved' ? 'Active' : 'Under Review'}
                            </span>
                          </td>
                          <td>
                            <div style={{ display: 'flex', gap: 8 }}>
                              {p.status !== 'approved' && (
                                <button onClick={() => handleVerify(p.id)} style={{ background: '#1E7B3C', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: 6, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                                  Verify
                                </button>
                              )}
                              <button onClick={() => handleDelete(p.id)} style={{ background: '#FFE8E5', color: '#B8564F', border: 'none', padding: '6px 12px', borderRadius: 6, fontSize: 12, fontWeight: 700, cursor: 'pointer' }} title="Delete Record">
                                <i className="fas fa-trash"></i>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Placeholders for other tabs */}
        {activeTab === 'clients' && (
          <div className="fadein" style={{ textAlign: 'center', padding: '60px 0', color: 'rgba(10,31,18,0.5)' }}>
            <i className="fas fa-users" style={{ fontSize: 48, marginBottom: 16, color: '#CBD5E1' }}></i>
            <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 8 }}>Active Clients Directory</h2>
            <p>This module is connected to the live database. Active records will appear here.</p>
          </div>
        )}

        {activeTab === 'invoices' && (
          <div className="fadein" style={{ textAlign: 'center', padding: '60px 0', color: 'rgba(10,31,18,0.5)' }}>
            <i className="fas fa-file-invoice" style={{ fontSize: 48, marginBottom: 16, color: '#CBD5E1' }}></i>
            <h2 className="serif" style={{ fontSize: 24, color: '#0A1F12', marginBottom: 8 }}>Invoice Management</h2>
            <p>Generate and send monthly invoices to active clients here.</p>
          </div>
        )}

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
